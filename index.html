<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yotuna - Discover radio stations worldwide, track live playlists, and find songs on your favorite streaming services." />
    <meta name="theme-color" content="#007AFF" />
    <title>Yotuna - Radio Station Discovery</title>
    <script type="text/javascript">
      // SPA redirect restore for GitHub Pages.
      // 404.html rewrites deep links to /?/path&query; this restores the real URL
      // into history so client-side routing (e.g. /station/:id) works on refresh.
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
